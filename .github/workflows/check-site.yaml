name: Check website

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUGO_VERSION: 0.156.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Hugo Extended
        working-directory: ${{ runner.temp }}
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --silent --show-error --location --remote-name "$release/$archive"
          curl --fail --silent --show-error --location --remote-name "$release/hugo_${HUGO_VERSION}_checksums.txt"
          awk -v file="$archive" '$2 == file {print}' "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "$archive" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build German and English pages
        run: hugo --gc --minify
      - name: Check internal links
        run: python3 scripts/check_site.py public
