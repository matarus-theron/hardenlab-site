# Automatic Claude review of every pull request (maintainer 2026-11-14).
# Codex reviews PRs as well; Claude reviews independently so that two different models check each
# other's work. Review only: Claude posts inline comments on concrete defects (or one summary comment
# when it finds none); it does not push, merge or run repository code.
#
# Needs the Claude GitHub App on this repository and the secret CLAUDE_CODE_OAUTH_TOKEN
# (`claude setup-token`). The action only runs once this file is on the default branch, unchanged.
# Docs: https://code.claude.com/docs/en/github-actions
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repository branches only: no secrets for PRs from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Repository rules: if AGENTS.md or CLAUDE.md exist, read them first; they are binding.
            Report concrete defects with a failure scenario; no praise, no style nits. Never quote
            secrets, tokens, real hostnames or IPs in comments. Write comments in English.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'